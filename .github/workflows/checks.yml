#
# Repository checks for every PR and push (see AGENTS.md, Build and test):
# REUSE licensing, KiCad version consistency, the silkscreen revision check,
# the protocol vectors and the firmware (host tests and the ESP32-S3 build).
# The jobs have no path filters, so they always report and can be required
# status checks. With no boards yet the KiCad checks pass. The ERC/DRC gate is
# separate (kicad-checks.yml).

name: Checks

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
    tags: ["hw-*", "fw-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    name: REUSE lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: reuse lint
        run: uvx --from 'reuse[charset-normalizer]' reuse lint

  kicad-version:
    name: KiCad version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test the check
        working-directory: tools/kicad_ci
        run: python -m unittest -v test_kicad_files test_check_kicad_version

      - name: Check KiCad files and docs against KICAD_VERSION
        run: python tools/kicad_ci/check_kicad_version.py

  silkscreen:
    name: Silkscreen revision check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test the check
        working-directory: tools/kicad_ci
        run: python -m unittest -v test_kicad_files test_check_silkscreen

      # On hw-* tag builds the tag comes from GITHUB_REF and must match a board.
      - name: Check board revisions and silkscreen
        run: python tools/kicad_ci/check_silkscreen.py

  protocol:
    name: Protocol vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Round-trips every golden vector in protocol/vectors/ through the
      # reference codec, and checks the vectors match their generator.
      - name: Reference codec tests
        run: python -m unittest discover -v -s tools/protocol -p 'test_*.py'

      - name: Vectors up to date
        run: python tools/protocol/make_vectors.py --check

  firmware-host-tests:
    name: Firmware host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the fw-v* tags give the firmware version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # firmware/app against a fake HAL, with ASan and UBSan: the PTT
      # controller, the codec against every golden vector, config, sessions.
      - name: Build and run the host tests
        run: |
          cmake -S firmware/test -B build/fw-test
          cmake --build build/fw-test --parallel
          ctest --test-dir build/fw-test --output-on-failure

  firmware-target-build:
    name: Firmware target build (ESP-IDF)
    runs-on: ubuntu-latest
    # Espressif's official ESP-IDF image, pinned to the release in
    # firmware/platform/esp-idf/README.md (tag and digest).
    container:
      image: espressif/idf:v6.0.3@sha256:54278f2c01e6e759502e2f04c9103589c17528923426f4d63193490c7a08f555
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the fw-v* tags give the firmware version

      - name: Build for the ESP32-S3
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          cd firmware/platform/esp-idf
          idf.py build
          idf.py size

      - name: Upload the firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3-devkitm1
          path: |
            firmware/platform/esp-idf/build/rig_interface.bin
            firmware/platform/esp-idf/build/rig_interface.elf
            firmware/platform/esp-idf/build/bootloader/bootloader.bin
            firmware/platform/esp-idf/build/partition_table/partition-table.bin
            firmware/platform/esp-idf/build/flash_args
            firmware/platform/esp-idf/build/flasher_args.json
          if-no-files-found: error
